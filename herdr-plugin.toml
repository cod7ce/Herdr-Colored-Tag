id = "local.herdr-colored-tag"
name = "Herdr Colored Tag"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Sort parent Spaces by tag and color their native titles and Agents workspace labels."
platforms = ["macos", "linux"]

[[actions]]
id = "manage"
title = "Space 标签管理"
contexts = ["global", "workspace"]
command = ["python3", "herdr_group.py", "open"]

[[actions]]
id = "tag"
title = "设置 Space 标签"
contexts = ["global", "workspace"]
command = ["python3", "herdr_group.py", "open", "--tag"]

[[actions]]
id = "detach"
title = "移除当前 Space 标签"
contexts = ["workspace"]
command = ["python3", "herdr_group.py", "untag"]

[[actions]]
id = "sync"
title = "刷新 Space 标签"
contexts = ["global", "workspace"]
command = ["python3", "herdr_group.py", "sync"]

[[startup]]
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "workspace.created"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "workspace.closed"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "workspace.renamed"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "workspace.moved"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "workspace.reordered"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "worktree.created"
command = ["python3", "herdr_group.py", "sync"]

[[events]]
on = "worktree.opened"
command = ["python3", "herdr_group.py", "sync"]

[[panes]]
id = "manager"
title = "Space 标签管理"
placement = "popup"
width = "80%"
height = "75%"
command = ["python3", "herdr_group.py", "ui"]
